seed: 42

model:
  name: gpt2          # GPT-2 124M
  max_new_tokens: 20  # generated tokens per continuation

data:
  prompt_tokens: 8        # length of IMDB prompts
  n_train: 5000           # positive reviews used for SFT
  n_val: 500              # positive reviews held out for validation
  n_test_prompts: 200     # fixed test size (must not change)
  n_wiki_samples: 200     # Wikipedia samples used for perplexity
  n_shakespeare: 500      # Shakespeare passages for task vectors
reward:
  name: distilbert/distilbert-base-uncased-finetuned-sst-2-english

sft:
  lr: 5.0e-5
  batch_size: 16
  epochs: 1
  max_length: 128      # truncate reviews (keeps CPU training tractable)
  checkpoint_dir: checkpoints/sft

eval:
  gen_batch_size: 16      # prompts per generation batch
  n_generations: 4        # generations per test prompt (fixed, must not change)
  ppl_max_length: 256     # truncation length for perplexity

results_dir: results